<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rizki Akbar | Menu Biodata</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f6f5ef;
            --muted: #aeb8b2;
            --surface: #182522;
            --line: rgba(230, 242, 232, 0.13);
            --mint: #a8f0c4;
            --lime: #d7f36a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 12% 12%, rgba(81, 156, 112, 0.23), transparent 34%),
                radial-gradient(ellipse at 90% 86%, rgba(191, 211, 91, 0.12), transparent 30%),
                #101916;
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            padding: 36px 22px;
        }

        .container {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }

        .header-chat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 16px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-chat .time {
            color: var(--mint);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .intro {
            display: grid;
            grid-template-columns: 220px 1fr;
            align-items: center;
            gap: clamp(28px, 7vw, 76px);
            padding: 64px 0 52px;
        }

        .portrait-wrap {
            position: relative;
            width: 196px;
            aspect-ratio: 1;
            margin: 0 auto;
        }

        .portrait-wrap::before,
        .portrait-wrap::after {
            position: absolute;
            content: "";
            border-radius: 50%;
        }

        .portrait-wrap::before {
            inset: -12px;
            border: 1px solid rgba(168, 240, 196, 0.38);
        }

        .portrait-wrap::after {
            width: 30px;
            height: 30px;
            top: 4px;
            right: -18px;
            background: var(--lime);
            box-shadow: 0 0 30px rgba(215, 243, 106, 0.35);
        }

        .portrait {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid rgba(246, 245, 239, 0.92);
            border-radius: 50%;
            background: #29443a;
            object-fit: cover;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--mint);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 640px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 68px);
            font-weight: 400;
            line-height: 1.04;
        }

        h1 span {
            color: var(--lime);
            font-style: italic;
        }

        .intro-copy {
            max-width: 480px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .menu-heading {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin: 0 0 14px;
        }

        .menu-heading h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 400;
        }

        .menu-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            min-height: 68px;
            background: linear-gradient(110deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.018));
            color: var(--ink);
            text-decoration: none;
            padding: 14px 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background-color: rgba(168, 240, 196, 0.09);
            border-color: rgba(168, 240, 196, 0.55);
            transform: translateX(4px);
            outline: none;
        }

        .menu-item .icon {
            display: grid;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            place-items: center;
            border-radius: 8px;
            background: rgba(168, 240, 196, 0.12);
            font-size: 18px;
        }

        .menu-item .arrow {
            margin-left: auto;
            color: var(--mint);
            font-size: 20px;
        }

        @media (max-width: 620px) {
            body {
                padding: 24px 20px 36px;
            }

            .intro {
                grid-template-columns: 1fr;
                gap: 34px;
                padding: 48px 0 42px;
                text-align: center;
            }

            .portrait-wrap {
                width: 154px;
            }

            .intro-copy {
                margin: 14px auto 0;
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-chat">
            <span>Rizki Akbar Pradana</span>
            <span class="time">10 RPL 1</span>
        </div>

        <main>
            <section class="intro" aria-labelledby="intro-title">
                <div class="portrait-wrap">
                    <img class="portrait" src="https://github.com/rizkiakbarpradana.png" alt="Foto profil Rizki Akbar Pradana">
                </div>
                <div>
                    <p class="eyebrow">Halo, selamat datang</p>
                    <h1 id="intro-title">Ruang kecil <span>Rizki.</span></h1>
                    <p class="intro-copy">Kenali biodata dan hasil karya saya melalui pilihan di bawah ini.</p>
                </div>
            </section>

            <section aria-labelledby="menu-title">
                <div class="menu-heading">
                    <h2 id="menu-title">Jelajahi</h2>
                    <p>Pilih halaman</p>
                </div>
        <div class="menu-list">
                    <a href="form_biodata_pak.bagus.html" class="menu-item"><span class="icon">📝</span>Form Biodata<span class="arrow" aria-hidden="true">→</span></a>
                    <a href="hasil_biodata_pak.bagus.html" class="menu-item"><span class="icon">📋</span>Hasil Biodata<span class="arrow" aria-hidden="true">→</span></a>
                    <a href="tabel.html.html" class="menu-item"><span class="icon">🔎</span>Tabel<span class="arrow" aria-hidden="true">→</span></a>
                    <a href="https://github.com/rizkiakbarpradana" class="menu-item"><span class="icon">🌐</span>Profil GitHub<span class="arrow" aria-hidden="true">↗</span></a>
                </div>
            </section>
        </main>
        </div>

    </div>

</body>
</html>
